const ls={};let n=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('pb_')&&k!='pb_rem'){try{ls[k]=JSON.parse(localStorage.getItem(k));n++}catch(e){}}}
if(n)await migrate(ls);else{DB={pb_users:[],pb_subs:{},pb_orph:[]};const t=JSON.stringify(splitDB('')[ACCF]);await wrF(ACCF,t);WC[ACCF]=t}return}
DB={pb_users:acc.pb_users||[],pb_subs:acc.pb_subs||{},pb_orph:acc.pb_orph||[]};WC[ACCF]=JSON.stringify(splitDB('')[ACCF])}
let CBA,CBB;
async function pickDir(){let h;try{h=await showDirectoryPicker({mode:'readwrite',id:'palbooks'})}catch(e){if(e.name!='AbortError')al(e.message);return}
let has=false;for(const n of ['pal_books_accounts.json','pal_books_data.json']){try{await h.getFileHandle(n);has=true}catch(e){}}
const cur=LD?DB:null,fin=async()=>{try{await idb('set',h);if(!await idb('get'))al('Warning: this browser could not remember the folder (private window?). You will have to choose it each time.')}catch(e){}},
useIt=async()=>{const o=DH;DH=h;try{await ld()}catch(e){DH=o;return al('Could not read the data file: '+e.message)}await fin();CO=null;D=null;LD=true;start()},
copy=async()=>{const keep={};for(const x of DB.pb_users||[]){if(x.f&&x.u!=U){const o=await rdF(x.f);if(o)keep[x.f]=o}}DH=h;for(const k in WC)delete WC[k];for(const f in keep){const t=JSON.stringify(keep[f]);await wrF(f,t);WC[f]=t}await flush();LD=true;await fin();al('Data saved to the new folder.',1);render()};
if(!cur)return useIt();if(!has)return copy();
CBA=()=>{cl();useIt()};CBB=()=>{cl();copy()};
mod(`<h3>This folder already contains Pal Books data</h3><p>Folder: <b>${esc(h.name)}</b></p><p class="row"><button onclick="CBA()">Use the data in this folder</button><button class="s" onclick="CBB()">Replace it with my current data</button><button class="s" onclick="cl()">Cancel</button></p><p style="color:#6b6c72;font-size:12px">Your previous folder is not changed or deleted.</p>`)}
async function allow(){try{if(await DH.requestPermission({mode:'readwrite'})!='granted')return al('Permission was not granted.');await ld();start()}catch(e){DH=null;al('Could not open the data folder: '+e.message);gate('choose')}}
async function ensure(){try{if(await DH.requestPermission({mode:'readwrite'})!='granted'){al('Permission to the data folder is required.');return false}await ld();LD=true;return true}catch(e){al('Could not open the data folder: '+e.message);return false}}
async function start(){LD=true;if(U&&!users().some(x=>x.u==U))U=null;if(!U){const r=localStorage.getItem('pb_rem');if(r&&users().some(x=>x.u==r)){U=r;sessionStorage.setItem('pbu',r)}}if(U){await loadUser();claim()}render()}
async function boot(){try{const r=await fetch('/api/ping',{cache:'no-store'}),j=await r.json();if(j&&j.palbooks){ON=true;return onBoot()}}catch(e){}if(location.protocol.startsWith('http')){try{const r=await fetch('api/data',{cache:'no-store'});if(r.ok){SV=true;setInterval(()=>fetch('api/ping',{cache:'no-store'}).catch(()=>{}),30000);await ld();return start()}}catch(e){}}if(!window.showDirectoryPicker)return gate('unsupported');try{DH=await idb('get')||null;if(DH&&await DH.queryPermission({mode:'readwrite'})=='granted'){await ld();return start()}}catch(e){DH=DH||null}if(DH){DB={};U=null;AM='in';const r=localStorage.getItem('pb_rem');if(r)$('app').innerHTML=`<div class="c" style="max-width:380px;margin:80px auto;text-align:center"><h2>Pal Books</h2><p>Welcome back<br><b>${esc(r)}</b></p><p><button onclick="cont()">Continue</button></p><p><a href="#" onclick="render();return false" style="font-size:12px">Use another account</a></p><p><a href="#" onclick="pickDir();return false" style="font-size:12px">Change data folder</a></p></div>`;else render()}else gate('choose')}
async function cont(){if(!await ensure())return;const z=users().find(x=>x.u==localStorage.getItem('pb_rem'));if(z){U=z.u;sessionStorage.setItem('pbu',U);await loadUser();if(AD){const cs=cos();cs.forEach(c=>c.o=U);S('pb_cos',cs);AD=false}claim();CO=null;D=null;go('dash')}else{AM='in';render()}}
const DRE=/\b(\d{4})-(\d{2})-(\d{2})\b/g,LR='\u200E';
function fdt(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:(n.nodeValue.search(DRE)>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP)}),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(n=>n.nodeValue=n.nodeValue.replace(DRE,(m,y,mo,d)=>LR+(+d)+'/'+(+mo)+'/'+y+LR))}
const ST2={};
function sk(t){t=t.replace(/\u200E/g,'').trim();let m;if(m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))return[0,+m[3]*1e4+m[2]*100+ +m[1]];if(m=t.match(/^(\d{4})-(\d{2})-(\d{2})$/))return[0,+m[1]*1e4+m[2]*100+ +m[3]];if(m=t.match(/^(?:[₪$€£]|JD )?\s*(-?[\d,]+(?:\.\d+)?)\s*%?$/))return[0,parseFloat(m[1].replace(/,/g,''))];return[1,t.toLowerCase()]}
function sortT(tb,i,tg){const hs=[...tb.rows[0].cells],sig=hs.map(c=>c.textContent.trim()).join('|');let st=ST2[sig];if(tg)st=ST2[sig]=st&&st.i==i?{i,d:-st.d}:{i,d:1};if(!st)return;
const body=tb.tBodies[0],all=[...body.rows].filter(r=>r!==tb.rows[0]),fx=all.filter(r=>r.classList.contains('t')||r.cells.length==1),dat=all.filter(r=>!fx.includes(r));
dat.sort((a,b)=>{const x=sk(a.cells[st.i]?a.cells[st.i].textContent:''),y=sk(b.cells[st.i]?b.cells[st.i].textContent:'');if(x[0]!=y[0])return(x[0]-y[0])*st.d;return(x[0]?String(x[1]).localeCompare(String(y[1]),undefined,{numeric:true}):x[1]-y[1])*st.d});
dat.concat(fx).forEach(r=>body.appendChild(r));hs.forEach((h,j)=>{h.classList.remove('sa','sd');if(j==st.i)h.classList.add(st.d>0?'sa':'sd')})}
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('table.srt th');if(!th||th.classList.contains('np')||!th.textContent.trim())return;sortT(th.closest('table'),[...th.parentNode.children].indexOf(th),true)});
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType==1){fdt(n);(n.matches('table.srt')?[n]:[...n.querySelectorAll('table.srt')]).forEach(tb=>{const sg=[...tb.rows[0].cells].map(c=>c.textContent.trim()).join('|');if(ST2[sg])sortT(tb,ST2[sg].i,false)})}else if(n.nodeType==3&&n.parentNode&&n.parentNode.nodeType==1)fdt(n.parentNode)}))).observe(document.body,{childList:true,subtree:true});
let MP={x:0,y:0};
document.addEventListener('pointerdown',e=>{const bx=e.target.closest&&e.target.closest('.m>div');if(!bx||e.button||e.target.closest('input,select,textarea,button,a,label,table,option'))return;e.preventDefault();const sx=e.clientX,sy=e.clientY,ox=MP.x,oy=MP.y;
const mv=ev=>{MP={x:ox+ev.clientX-sx,y:oy+ev.clientY-sy};bx.style.transform='translate('+MP.x+'px,'+MP.y+'px)';const r=bx.getBoundingClientRect();let ax=0,ay=0;if(r.top<0)ay=-r.top;else if(r.top>innerHeight-40)ay=innerHeight-40-r.top;if(r.left<80-r.width)ax=80-r.width-r.left;else if(r.left>innerWidth-80)ax=innerWidth-80-r.left;if(ax||ay){MP={x:MP.x+ax,y:MP.y+ay};bx.style.transform='translate('+MP.x+'px,'+MP.y+'px)'}},up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
const stk=()=>{const h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')};new MutationObserver(stk).observe($('app'),{childList:true});addEventListener('resize',stk);stk();
boot();
</script></body></html>
